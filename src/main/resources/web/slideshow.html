<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- iOS Safari would turn times and dates into black links -->
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="color-scheme" content="dark">
<title>Photoframe</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  body.idle { cursor: none; }
  /* Same white text on every browser (iOS Safari otherwise colours detected dates and times) */
  #overlay, #overlay *, #message, #message *, #nightClock, #paused { color: #fff; -webkit-text-fill-color: #fff; }
  #overlay a, #message a { color: inherit; text-decoration: none; pointer-events: none; }
  .slide { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow: hidden; opacity: 0; will-change: opacity, transform, clip-path; }
  .slide.visible { opacity: 1; }
  .slide img { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; }
  .slide .bg { object-fit: cover; filter: blur(32px) brightness(0.55); transform: scale(1.15); }
  .slide .fg { object-fit: contain; transform-origin: 50% 50%; }
  .slide.fit-fill .fg { object-fit: cover; }
  .slide.fit-fit .bg, .slide.fit-fill .bg { display: none; }
  /* Layers: pictures 1–2, overlays 10, message 11, night 20, indicators 30 */
  #overlay { z-index: 10; }
  #message { z-index: 11; }
  #night { z-index: 20; }
  #status, #paused { z-index: 30; }
  #overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 4vw 3vh; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
             background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); pointer-events: none; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #overlay.empty { display: none; }
  #left { min-width: 0; }
  #weather { display: none; align-items: center; }
  #weather.on { display: flex; }
  #weatherIcon { display: none; width: 8vw; height: 8vw; width: clamp(48px, 8vw, 112px); height: clamp(48px, 8vw, 112px); object-fit: contain; margin-right: 1.2vw; }
  #weatherIcon.on { display: block; }
  #weatherTemp { font-size: 6vw; font-size: clamp(28px, 6vw, 80px); font-weight: 300; line-height: 1; white-space: nowrap; }
  #weatherText { font-size: 1.8vw; font-size: clamp(14px, 1.8vw, 24px); opacity: 0.9; margin-top: 6px; }
  #weatherItems { font-size: 1.9vw; font-size: clamp(14px, 1.9vw, 26px); margin-top: 8px; }
  #weatherItems span { margin-right: 1.2em; white-space: nowrap; }
  #weatherItems small { opacity: 0.75; margin-right: 0.35em; }
  #weatherItems img { height: 1.6em; vertical-align: middle; }
  #caption { font-size: 2.6vw; font-size: clamp(16px, 2.6vw, 34px); font-weight: 500; }
  #info { text-align: right; }
  #clock { font-size: 6vw; font-size: clamp(28px, 6vw, 80px); font-weight: 300; line-height: 1; }
  #date { font-size: 1.8vw; font-size: clamp(14px, 1.8vw, 24px); opacity: 0.9; margin-top: 6px; }
  #items { font-size: 1.9vw; font-size: clamp(14px, 1.9vw, 26px); margin-top: 8px; }
  #items span { margin-left: 1.2em; white-space: nowrap; }
  #items small { opacity: 0.75; margin-right: 0.35em; }
  #items img { height: 1.6em; vertical-align: middle; }
  #night { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 2s; display: flex; align-items: center; justify-content: center; }
  #night.on { opacity: 1; }
  #night.dim { background: rgba(0,0,0,0.85); }
  #nightClock { font-size: 14vw; font-size: clamp(48px, 14vw, 200px); font-weight: 200; color: #fff; opacity: 0.28; display: none; }
  #night.clock #nightClock { display: block; }
  #message { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 8vw; font-size: 3vw; font-size: clamp(18px, 3vw, 36px); line-height: 1.4; }
  #message.on { display: flex; }
  #message small { display: block; font-size: 0.55em; opacity: 0.7; margin-top: 12px; word-break: break-all; }
  #status { position: absolute; top: 12px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: #ff9500; display: none; }
  #status.on { display: block; }
  #paused { position: absolute; top: 12px; left: 14px; font-size: 22px; opacity: 0.6; display: none; }
  #paused.on { display: block; }
</style>
</head>
<body>
<div class="slide" id="slideA"><img class="bg" alt=""><img class="fg" alt=""></div>
<div class="slide" id="slideB"><img class="bg" alt=""><img class="fg" alt=""></div>
<div id="overlay" class="empty">
  <div id="left">
    <div id="weather"><img id="weatherIcon" alt=""><div><div id="weatherTemp"></div><div id="weatherText"></div></div></div>
    <div id="weatherItems"></div>
    <div id="caption"></div>
  </div>
  <div id="info"><div id="clock"></div><div id="date"></div><div id="items"></div></div>
</div>
<div id="message"></div>
<div id="night"><div id="nightClock"></div></div>
<div id="paused">&#10074;&#10074;</div>
<div id="status" title="No connection to openHAB"></div>
<div id="app" style="display:none; position:absolute; top:0; right:0; bottom:0; left:0; z-index:50; background:#000;">
  <iframe id="appFrame" title="openHAB" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0; background:#fff;"></iframe>
  <div id="appClose" style="position:absolute; left:10px; bottom:10px; width:44px; height:44px; line-height:44px; text-align:center; border-radius:22px; font-size:22px; color:#fff; -webkit-text-fill-color:#fff; background:rgba(0,0,0,0.45); cursor:pointer; z-index:51; transition:opacity 0.5s;" title="Back to the slideshow">&#10005;</div>
</div>
<div id="error" style="display:none; position:absolute; left:8px; right:8px; top:8px; z-index:40; padding:8px; font-size:13px; color:#ff8a80; background:rgba(0,0,0,0.7); border-radius:6px; word-break:break-all;"></div>
<script>
(function () {
  'use strict';
  var de = (navigator.language || 'en').toLowerCase().indexOf('de') === 0;
  var T = de ? {
    empty: 'Keine Bilder im Ordner', emptyHint: 'Lege Bilder in diesen Ordner:', loading: 'Bilder werden geladen …',
    offline: 'Keine Verbindung zu openHAB'
  } : {
    empty: 'No pictures in the folder', emptyHint: 'Put pictures into this folder:', loading: 'Loading pictures …',
    offline: 'No connection to openHAB'
  };
  var query = location.search;

  // Returns a parameter of the page address (works without URLSearchParams in old web views)
  function param(name) {
    var parts = query.substring(1).split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (decodeURIComponent(kv[0]) === name) {
        return decodeURIComponent((kv.slice(1).join('=') || '').replace(/\+/g, ' '));
      }
    }
    return null;
  }
  // "&tap=…" lets every screen open its own address or app, e.g. openhab:// on an iPad
  var deviceTapUrl = param('tap');
  var slides = [document.getElementById('slideA'), document.getElementById('slideB')];
  var active = 0;
  var state = null;
  var shownKey = null;
  var shownSeq = -1;
  var loadingKey = null;
  var wakeUntil = 0;
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var transitions = ['FADE', 'SLIDE', 'WIPE', 'ZOOM'];

  function $(id) { return document.getElementById(id); }
  function imageUrl(key) { return 'image/' + key + '.jpg' + query; }

  // --- state polling ---------------------------------------------------------------------------------------
  // XMLHttpRequest instead of fetch: works in every Android web view
  function poll() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'state' + query + '&t=' + Date.now(), true);
    xhr.timeout = 10000;
    xhr.onload = function () {
      try {
        if (xhr.status !== 200) { throw new Error('HTTP ' + xhr.status); }
        state = JSON.parse(xhr.responseText);
        $('status').classList.remove('on');
        apply();
      } catch (e) {
        $('status').classList.add('on');
        if (!(e instanceof SyntaxError) && String(e.message).indexOf('HTTP') !== 0) { showError(e); }
      }
      setTimeout(poll, 1000);
    };
    xhr.onerror = xhr.ontimeout = function () {
      $('status').classList.add('on');
      setTimeout(poll, 2000);
    };
    xhr.send();
  }

  // Shows script errors on the screen instead of a silent black page
  function showError(e) {
    var el = $('error');
    el.textContent = 'Photoframe: ' + (e && e.message ? e.message : e) + ' – ' + navigator.userAgent;
    el.style.display = 'block';
  }
  window.onerror = function (message, source, line) {
    showError(message + (line ? ' (line ' + line + ')' : ''));
  };

  function apply() {
    var s = state;
    $('paused').classList.toggle('on', !!s.paused);
    updateNight();
    updateOverlay();
    if (!s.image) {
      showMessage(s.count === 0 ? T.empty : T.loading, s.count === 0 ? s.folder : null);
      return;
    }
    hideMessage();
    if (s.image.key !== shownKey || s.seq !== shownSeq) {
      show(s.image, s.seq);
    }
    if (s.upcoming) { preload(s.upcoming.key); }
  }

  // --- pictures and transitions ----------------------------------------------------------------------------
  var preloaded = {};
  function preload(key) {
    if (preloaded[key]) { return; }
    var img = new Image();
    img.src = imageUrl(key);
    preloaded = {};
    preloaded[key] = img;
  }

  function show(image, seq) {
    if (loadingKey === image.key) { return; }
    loadingKey = image.key;
    var probe = new Image();
    probe.onload = function () {
      loadingKey = null;
      if (!state || !state.image || state.image.key !== image.key) { return; }
      swap(image, seq, probe.naturalWidth / probe.naturalHeight);
    };
    probe.onerror = function () { loadingKey = null; };
    probe.src = imageUrl(image.key);
  }

  function fitClass(ratio) {
    var mode = state.settings.fitMode;
    if (mode === 'AUTO') {
      var screen = window.innerWidth / window.innerHeight;
      mode = Math.abs(ratio - screen) / screen < 0.15 ? 'FILL' : 'BLUR';
    }
    return 'fit-' + mode.toLowerCase();
  }

  function swap(image, seq, ratio) {
    var settings = state.settings;
    var next = slides[1 - active];
    var prev = slides[active];
    var url = imageUrl(image.key);
    next.className = 'slide ' + fitClass(ratio);
    next.querySelector('.bg').src = url;
    var fg = next.querySelector('.fg');
    fg.src = url;
    next.style.zIndex = 2;
    prev.style.zIndex = 1;

    var first = shownKey === null;
    var type = settings.transition;
    if (type === 'RANDOM') { type = transitions[Math.floor(Math.random() * transitions.length)]; }
    var duration = first || type === 'NONE' ? 0 : settings.transitionSeconds * 1000;
    animateIn(next, prev, type, duration, function () {
      // The caption changes when the new picture is fully visible
      $('caption').textContent = image.caption || '';
    });
    kenBurns(fg, settings, duration);

    shownKey = image.key;
    shownSeq = seq;
    active = 1 - active;
  }

  // Start and end states of the transitions; the end state is always the plain visible picture.
  var TRANSITION_START = {
    FADE: { opacity: '0' },
    SLIDE: { opacity: '1', transform: 'translateX(100%)' },
    WIPE: { opacity: '1', clipPath: 'inset(0 100% 0 0)' },
    ZOOM: { opacity: '0', transform: 'scale(1.18)' }
  };
  var TRANSITION_END = { opacity: '1', transform: 'translateX(0) scale(1)', clipPath: 'inset(0 0 0 0)' };
  var transitionToken = 0;

  function resetStyle(el) {
    el.style.transition = 'none';
    el.style.webkitTransition = 'none';
    el.style.opacity = '';
    el.style.transform = '';
    el.style.webkitTransform = '';
    el.style.clipPath = '';
    el.style.webkitClipPath = '';
  }

  // Sets a style, including the -webkit- variant needed by older Android web views
  function setStyle(el, key, value) {
    el.style[key] = value;
    if (key === 'clipPath') { el.style.webkitClipPath = value; }
    if (key === 'transform') { el.style.webkitTransform = value; }
  }

  // Uses CSS transitions, and sets the final state with a timer. The timer makes sure the new picture is
  // always shown, even if the browser skips or pauses the animation (for example on a sleeping tablet).
  function animateIn(next, prev, type, duration, done) {
    var token = ++transitionToken;
    var finish = function () {
      if (token !== transitionToken) { return; }
      resetStyle(next);
      resetStyle(prev);
      next.classList.add('visible');
      prev.classList.remove('visible');
      done();
    };
    resetStyle(next);
    resetStyle(prev);
    var start = TRANSITION_START[type];
    if (duration <= 0 || !start) { finish(); return; }

    Object.keys(start).forEach(function (k) { setStyle(next, k, start[k]); });
    void next.offsetWidth; // apply the start state before the transition begins
    var timing = duration + 'ms ease-in-out';
    next.style.transition = 'opacity ' + timing + ', transform ' + timing + ', clip-path ' + timing;
    next.style.webkitTransition = 'opacity ' + timing + ', -webkit-transform ' + timing + ', -webkit-clip-path ' + timing;
    Object.keys(start).forEach(function (k) { setStyle(next, k, TRANSITION_END[k]); });
    if (type === 'SLIDE') {
      prev.style.transition = 'transform ' + timing;
      prev.style.webkitTransition = '-webkit-transform ' + timing;
      setStyle(prev, 'transform', 'translateX(-100%)');
    }
    setTimeout(finish, duration + 60);
  }

  function kenBurns(fg, settings, transitionMs) {
    fg.getAnimations && fg.getAnimations().forEach(function (a) { a.cancel(); });
    if (!settings.kenBurns || reducedMotion || !fg.animate) { return; }
    var r = function () { return (Math.random() * 2 - 1) * 3; };
    var zoomIn = Math.random() < 0.5;
    var from = 'scale(' + (zoomIn ? 1.0 : 1.12) + ') translate(' + r() + '%, ' + r() + '%)';
    var to = 'scale(' + (zoomIn ? 1.12 : 1.0) + ') translate(' + r() + '%, ' + r() + '%)';
    fg.animate([{ transform: from }, { transform: to }],
      { duration: settings.interval * 1000 + transitionMs + 2000, easing: 'linear', fill: 'forwards' });
  }

  // --- overlays --------------------------------------------------------------------------------------------
  var shownItems = {};
  function updateItems(boxId, items) {
    // Rebuilt only on a change, so pictures do not flicker with every state update
    var key = JSON.stringify(items);
    if (key === shownItems[boxId]) { return; }
    shownItems[boxId] = key;
    var box = $(boxId);
    box.textContent = '';
    items.forEach(function (it) {
      var span = document.createElement('span');
      if (it.image) {
        var picture = document.createElement('img');
        picture.alt = '';
        picture.src = it.image;
        span.appendChild(picture);
      } else {
        if (it.label) { var l = document.createElement('small'); l.textContent = it.label; span.appendChild(l); }
        span.appendChild(document.createTextNode(it.value));
      }
      box.appendChild(span);
    });
  }

  function updateWeather(weather) {
    var w = weather || {};
    var icon = $('weatherIcon');
    if (w.icon && icon.getAttribute('src') !== w.icon) { icon.src = w.icon; }
    icon.classList.toggle('on', !!w.icon);
    $('weatherTemp').textContent = w.temperature || '';
    $('weatherText').textContent = w.text || '';
    var hasWeather = !!(w.icon || w.temperature || w.text);
    $('weather').classList.toggle('on', hasWeather);
    return hasWeather;
  }

  function updateOverlay() {
    var s = state.settings;
    var items = state.overlay || [];
    var weatherItems = state.weatherItems || [];
    updateItems('items', items);
    updateItems('weatherItems', weatherItems);
    var hasWeather = updateWeather(state.weather) || weatherItems.length > 0;
    var hasCaption = !!(state.image && state.image.caption);
    $('overlay').classList.toggle('empty', s.clock === 'NONE' && items.length === 0 && !hasCaption && !hasWeather);
    tickClock();
  }

  function tickClock() {
    if (!state) { return; }
    var now = new Date();
    var time = now.toLocaleTimeString(navigator.language, { hour: '2-digit', minute: '2-digit' });
    var mode = state.settings.clock;
    $('clock').textContent = mode === 'NONE' ? '' : time;
    $('date').textContent = mode === 'TIME_DATE'
      ? now.toLocaleDateString(navigator.language, { weekday: 'long', day: 'numeric', month: 'long' }) : '';
    $('nightClock').textContent = time;
  }
  setInterval(tickClock, 1000);

  function updateNight() {
    var mode = state.settings.nightMode;
    var on = !!state.night && Date.now() > wakeUntil;
    var el = $('night');
    el.classList.toggle('on', on);
    el.classList.toggle('dim', mode === 'DIM');
    el.classList.toggle('clock', mode === 'CLOCK');
  }

  // --- messages --------------------------------------------------------------------------------------------
  function showMessage(text, detail) {
    var el = $('message');
    el.textContent = '';
    var div = document.createElement('div');
    div.textContent = text;
    if (detail) {
      var small = document.createElement('small');
      small.textContent = T.emptyHint + ' ' + detail;
      div.appendChild(small);
    }
    el.appendChild(div);
    el.classList.add('on');
  }
  function hideMessage() { $('message').classList.remove('on'); }

  // --- tap, full screen, wake lock, cursor -----------------------------------------------------------------
  // --- openHAB (or another page of this server) as full screen layer -------------------------------------
  // Addresses of the same server open on top of the slideshow. As the page comes from the same server, the
  // slideshow sees touches inside it and returns by itself after the configured idle time.
  var appOpen = false;
  var appLastActivity = 0;
  var closeTimer = null;

  function isSameServer(url) {
    var a = document.createElement('a');
    a.href = url;
    return a.protocol === location.protocol && a.host === location.host;
  }
  function returnSeconds() {
    var p = param('return');
    var value = p !== null ? parseInt(p, 10) : (state ? state.settings.returnSeconds : 120);
    return isNaN(value) ? 120 : value;
  }
  function appActivity() { appLastActivity = Date.now(); }
  // The close button would cover the openHAB page, so it leaves after a moment. Without automatic return it is
  // the only way back and stays.
  function showClose() {
    var button = $('appClose');
    clearTimeout(closeTimer);
    button.style.opacity = '1';
    button.style.pointerEvents = 'auto';
    if (returnSeconds() > 0) {
      closeTimer = setTimeout(function () {
        button.style.opacity = '0';
        button.style.pointerEvents = 'none';
      }, 6000);
    }
  }
  function openApp(url) {
    var frame = $('appFrame');
    if (frame.getAttribute('data-src') !== url) {
      frame.setAttribute('data-src', url);
      frame.src = url;
    }
    $('app').style.display = 'block';
    appOpen = true;
    appActivity();
    showClose();
  }
  function closeApp() {
    $('app').style.display = 'none';
    appOpen = false;
  }
  // When the slideshow is embedded in a page, browsers block app addresses inside the frame
  function openExternal(url) {
    try {
      window.top.location.href = url;
    } catch (e) {
      location.href = url;
    }
  }
  $('appFrame').addEventListener('load', function () {
    try {
      var doc = $('appFrame').contentWindow.document;
      ['touchstart', 'pointerdown', 'mousedown', 'keydown', 'wheel', 'scroll'].forEach(function (ev) {
        doc.addEventListener(ev, appActivity, true);
      });
    } catch (e) {
      // another server: no idle detection possible, the close button still works
    }
  });
  $('appClose').addEventListener('click', function (e) {
    e.stopPropagation();
    closeApp();
  });
  setInterval(function () {
    var seconds = returnSeconds();
    if (appOpen && seconds > 0 && Date.now() - appLastActivity > seconds * 1000) { closeApp(); }
  }, 1000);

  document.addEventListener('click', function () {
    if (appOpen) { return; }
    if (state && state.night && Date.now() > wakeUntil) {
      wakeUntil = Date.now() + 30000;
      updateNight();
      return;
    }
    var tapUrl = deviceTapUrl || (state && state.settings.tapUrl);
    if (tapUrl) {
      if (isSameServer(tapUrl)) { openApp(tapUrl); } else { openExternal(tapUrl); }
      return;
    }
    var d = document;
    // Older web views return no Promise here
    var result = null;
    if (!d.fullscreenElement && d.documentElement.requestFullscreen) {
      result = d.documentElement.requestFullscreen();
    } else if (d.exitFullscreen) {
      result = d.exitFullscreen();
    }
    if (result && result.catch) { result.catch(function () {}); }
  });

  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') { return; }
    navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }).catch(function () {});
  }
  document.addEventListener('visibilitychange', requestWakeLock);
  requestWakeLock();

  var idleTimer = null;
  document.addEventListener('mousemove', function () {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { document.body.classList.add('idle'); }, 3000);
  });
  document.body.classList.add('idle');
  $('status').title = T.offline;

  poll();
})();
</script>
</body>
</html>
