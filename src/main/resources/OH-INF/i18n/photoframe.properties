# add-on

addon.photoframe.name = Photo Frame Binding
addon.photoframe.description = Digital photo frame and tablet screensaver with pictures from a local folder, Google Drive or Dropbox.

# thing types

thing-type.photoframe.dropbox.label = Dropbox Account
thing-type.photoframe.dropbox.description = Login to Dropbox. The binding only sees its own app folder in your Dropbox.
thing-type.photoframe.frame.label = Photo Frame
thing-type.photoframe.frame.description = A slideshow of the pictures in one folder, shown on a web page that can be used as tablet screensaver.

# thing types config

thing-type.config.photoframe.dropbox.appKey.label = App Key
thing-type.config.photoframe.dropbox.appKey.description = App key of your own Dropbox app (Scoped access, App folder).
thing-type.config.photoframe.dropbox.authCode.label = Authorization Code
thing-type.config.photoframe.dropbox.authCode.description = Code shown by Dropbox after you allowed access. It is cleared after a successful login.
thing-type.config.photoframe.frame.apiKey.label = Google API Key
thing-type.config.photoframe.frame.apiKey.description = API key of your Google Cloud project, needed for Google Drive.
thing-type.config.photoframe.frame.baseUrl.label = openHAB Address
thing-type.config.photoframe.frame.baseUrl.description = Address of openHAB as seen from the screens, e.g. http://192.168.1.10:8080. Empty detects it; set it when openHAB runs in Docker without host network.
thing-type.config.photoframe.frame.cacheSizeMb.label = Cache Size
thing-type.config.photoframe.frame.caption.label = Caption
thing-type.config.photoframe.frame.caption.option.NONE = None
thing-type.config.photoframe.frame.caption.option.FILENAME = File name
thing-type.config.photoframe.frame.clock.label = Clock
thing-type.config.photoframe.frame.clock.option.NONE = None
thing-type.config.photoframe.frame.clock.option.TIME = Time
thing-type.config.photoframe.frame.clock.option.TIME_DATE = Time and date
thing-type.config.photoframe.frame.fitMode.label = Fit Mode
thing-type.config.photoframe.frame.fitMode.description = How pictures with a different aspect ratio than the screen are shown.
thing-type.config.photoframe.frame.fitMode.option.BLUR = Fit with blurred background
thing-type.config.photoframe.frame.fitMode.option.FIT = Fit with black borders
thing-type.config.photoframe.frame.fitMode.option.FILL = Fill screen (crop)
thing-type.config.photoframe.frame.fitMode.option.AUTO = Automatic
thing-type.config.photoframe.frame.folder.label = Dropbox Folder
thing-type.config.photoframe.frame.folder.description = Sub folder in the Dropbox app folder. Empty uses the app folder itself.
thing-type.config.photoframe.frame.group.night.label = Night Mode
thing-type.config.photoframe.frame.group.overlay.label = Overlays
thing-type.config.photoframe.frame.group.slideshow.label = Slideshow
thing-type.config.photoframe.frame.group.source.label = Source
thing-type.config.photoframe.frame.interval.label = Display Time
thing-type.config.photoframe.frame.interval.description = Seconds each picture is shown.
thing-type.config.photoframe.frame.kenBurns.label = Ken Burns Effect
thing-type.config.photoframe.frame.kenBurns.description = Slowly zoom and pan while a picture is shown.
thing-type.config.photoframe.frame.link.label = Shared Link
thing-type.config.photoframe.frame.link.description = Shared folder link for Google Drive or Dropbox.
thing-type.config.photoframe.frame.localFolder.label = Local Folder
thing-type.config.photoframe.frame.localFolder.description = Folder with the pictures. Empty creates userdata/photoframe/<thing id>.
thing-type.config.photoframe.frame.maxSize.label = Maximum Picture Size
thing-type.config.photoframe.frame.maxSize.description = Longest side of the pictures sent to the screen.
thing-type.config.photoframe.frame.nightEnd.label = Night End
thing-type.config.photoframe.frame.nightEnd.description = Time in HH:mm.
thing-type.config.photoframe.frame.nightMode.label = Night Mode
thing-type.config.photoframe.frame.nightMode.option.OFF = Off
thing-type.config.photoframe.frame.nightMode.option.BLACK = Black screen
thing-type.config.photoframe.frame.nightMode.option.DIM = Dimmed pictures
thing-type.config.photoframe.frame.nightMode.option.CLOCK = Black screen with dimmed clock
thing-type.config.photoframe.frame.nightStart.label = Night Start
thing-type.config.photoframe.frame.nightStart.description = Time in HH:mm.
thing-type.config.photoframe.frame.order.label = Order
thing-type.config.photoframe.frame.order.option.RANDOM = Random
thing-type.config.photoframe.frame.order.option.NAME = By file name
thing-type.config.photoframe.frame.overlayItems.label = Overlay Items
thing-type.config.photoframe.frame.overlayItems.description = Up to 4 item names, separated by commas, whose values are shown on the pictures.
thing-type.config.photoframe.frame.refreshMinutes.label = Refresh Interval
thing-type.config.photoframe.frame.refreshMinutes.description = Minutes between reading the folder again. 0 uses the default of the source.
thing-type.config.photoframe.frame.sourceType.label = Source Type
thing-type.config.photoframe.frame.sourceType.option.LOCAL = Local folder
thing-type.config.photoframe.frame.sourceType.option.GOOGLE_DRIVE = Google Drive shared folder
thing-type.config.photoframe.frame.sourceType.option.DROPBOX_LINK = Dropbox shared folder link
thing-type.config.photoframe.frame.sourceType.option.DROPBOX = Dropbox account (needs the Dropbox bridge)
thing-type.config.photoframe.frame.tapUrl.label = Tap Address
thing-type.config.photoframe.frame.tapUrl.description = Address opened when the slideshow is tapped. Empty switches to full screen.
thing-type.config.photoframe.frame.transition.label = Transition
thing-type.config.photoframe.frame.transition.option.FADE = Fade
thing-type.config.photoframe.frame.transition.option.SLIDE = Slide
thing-type.config.photoframe.frame.transition.option.WIPE = Wipe
thing-type.config.photoframe.frame.transition.option.ZOOM = Zoom
thing-type.config.photoframe.frame.transition.option.RANDOM = Random
thing-type.config.photoframe.frame.transition.option.NONE = None
thing-type.config.photoframe.frame.transitionSeconds.label = Transition Duration

# channel types

channel-type.photoframe.control.label = Control
channel-type.photoframe.control.description = Play, pause, next and previous picture
channel-type.photoframe.currentImage.label = Current Picture
channel-type.photoframe.currentImage.description = File name of the picture currently shown
channel-type.photoframe.imageCount.label = Pictures
channel-type.photoframe.imageCount.description = Number of pictures in the folder
channel-type.photoframe.lastRefresh.label = Last Refresh
channel-type.photoframe.lastRefresh.description = Time the folder was read successfully
channel-type.photoframe.night.label = Night Mode Active
channel-type.photoframe.night.description = Shows whether the night mode is active; a command forces it until the next start or end time
channel-type.photoframe.pageUrl.label = Slideshow Address
channel-type.photoframe.pageUrl.description = Address of the slideshow page, for a browser or as screensaver address in a kiosk app
channel-type.photoframe.refresh.label = Refresh Now
channel-type.photoframe.refresh.description = ON reads the folder again now

# thing status descriptions

offline.config-error.missing-app-key = The Dropbox app key must be configured.
offline.config-pending.dropbox-not-implemented = Dropbox login is not implemented yet.
offline.config-error.local-folder = The folder {0} cannot be created.
offline.config-error.cache = The cache folder {0} cannot be created.
offline.config-error.source-not-available = This source is not available in this version yet.
online.empty-folder = Put pictures into {0}

# actions

action.next.label = Next Picture
action.next.description = Shows the next picture.
action.previous.label = Previous Picture
action.previous.description = Shows the previous picture.
action.pause.label = Pause
action.pause.description = Pauses the slideshow.
action.play.label = Play
action.play.description = Continues the slideshow.
action.refresh.label = Refresh
action.refresh.description = Reads the folder again now.
action.new-token.label = New Access Token
action.new-token.description = Creates a new access token. Slideshow addresses with the old token stop working.
action.output.page-url.label = Slideshow Address
