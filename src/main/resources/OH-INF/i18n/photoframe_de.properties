# add-on

addon.photoframe.name = Photoframe Binding
addon.photoframe.description = Digitaler Bilderrahmen und Tablet-Bildschirmschoner mit Bildern aus einem lokalen Ordner, Google Drive oder Dropbox.

# thing types

thing-type.photoframe.dropbox.label = Dropbox-Konto
thing-type.photoframe.dropbox.description = Anmeldung bei Dropbox. Das Binding sieht nur seinen eigenen App-Ordner in deiner Dropbox.
thing-type.photoframe.frame.label = Photoframe
thing-type.photoframe.frame.description = Eine Diashow der Bilder eines Ordners, angezeigt auf einer Webseite, die auch als Tablet-Bildschirmschoner dient.

